[project]
name = "beertracker"
version = "0.1.0"
description = "BeerTracker backend service — syncs Zettle transactions to Firebase Firestore"
readme = "README.md"
authors = [
    { name = "Edward Storlien", email = "edward.storlien@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "firebase-admin>=7.6.0",
    "httpx>=0.27.0",
    "tenacity>=9.1.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "apscheduler>=3.11.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
beertracker = "beertracker.__main__:main"
beertracker-cli = "beertracker.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["beertracker*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "D", "UP"]
ignore = ["D100", "D104", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
strict = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
